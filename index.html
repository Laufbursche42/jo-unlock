<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche Joyor Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <p class="hint infobox" data-t="infoBannerHtml"></p>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="set-row">
      <label data-t="modelLabel"></label>
      <select id="model-in"></select>
    </div>
    <p class="hint" data-t="modelHint"></p>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-act="connect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="encHint"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <div class="card-head"><h2 data-t="liveTitle"></h2><button type="button" class="help-btn" data-help="live" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile" id="tile-speed" hidden><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile" id="tile-trip" hidden><b id="t-trip">-</b><small data-t="tileTrip"></small></div>
      <div class="tile" id="tile-total" hidden><b id="t-total">-</b><small data-t="tileTotal"></small></div>
      <div class="tile" id="tile-max" hidden><b id="t-max">-</b><small data-t="tileMax"></small></div>
      <div class="tile" id="tile-lock" hidden><b id="t-lock">-</b><small data-t="tileLock"></small></div>
      <div class="tile" id="tile-light" hidden><b id="t-light">-</b><small data-t="tileLight"></small></div>
      <div class="tile" id="tile-volt" hidden><b id="t-volt">-</b><small data-t="tileVolt"></small></div>
      <div class="tile" id="tile-current" hidden><b id="t-current">-</b><small data-t="tileCurrent"></small></div>
      <div class="tile" id="tile-temp" hidden><b id="t-temp">-</b><small data-t="tileTemp"></small></div>
      <div class="tile" id="tile-runtime" hidden><b id="t-runtime">-</b><small data-t="tileRuntime"></small></div>
      <div class="tile" id="tile-err" hidden><b id="t-err">-</b><small data-t="tileErr"></small></div>
      <div class="tile" id="tile-fw" hidden><b id="t-fw">-</b><small data-t="tileFw"></small></div>
      <div class="tile" id="tile-serial" hidden><b id="t-serial">-</b><small data-t="tileSerial"></small></div>
      <div class="tile" id="tile-model" hidden><b id="t-model">-</b><small data-t="tileModel"></small></div>
    </div>
    <p class="hint" id="tiles-empty" data-t="tilesEmpty"></p>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile" id="tile-batt" hidden><b id="t-batt">-</b><small data-t="tileBatt"></small></div>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="more" aria-label="Info">?</button></div>
    <p class="hint" data-t="moreHint"></p>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <div class="set-row three">
      <label data-t="lblSpeedCap"></label>
      <input id="speed-kmh" type="number" step="1" min="1" max="25" value="6">
      <button class="primary" id="btn-setspeed" data-t="btnSetSpeed" disabled></button>
    </div>
    <p class="hint" data-t="speedCapHint"></p>
    <div class="set-row">
      <label data-t="immobTitle"></label>
      <button id="btn-immob-unlock" data-t="btnImmobUnlock" disabled></button>
      <button id="btn-immob-lock" data-t="btnImmobLock" disabled></button>
    </div>
    <p class="hint" data-t="immobHint"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div class="set-row">
      <label data-t="lblMode"></label>
      <select id="mode-in" disabled>
        <option value="1" data-t="modeElectric"></option>
        <option value="2" data-t="modeAssist"></option>
        <option value="3" data-t="modeKick"></option>
      </select>
      <button id="btn-mode" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblLight"></label>
      <select id="light-in"><option value="2" data-t="btnOn"></option><option value="1" data-t="btnOff"></option></select>
      <button id="btn-light" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblCruise"></label>
      <select id="cruise-in"><option value="1" data-t="btnOn"></option><option value="2" data-t="btnOff"></option></select>
      <button id="btn-cruise" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblStartMode"></label>
      <select id="startmode-in"><option value="1" data-t="startZero"></option><option value="2" data-t="startNonZero"></option></select>
      <button id="btn-startmode" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblUnit"></label>
      <select id="unit-in"><option value="1" data-t="optKm"></option><option value="2" data-t="optMi"></option></select>
      <button id="btn-unit" data-t="btnSend" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblGear"></label>
      <select id="gear-in">
        <option value="1" data-t="gearP"></option>
        <option value="2" data-t="gearD1"></option>
        <option value="3" data-t="gearD2"></option>
        <option value="4" data-t="gearD3"></option>
      </select>
      <button id="btn-gear" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblLamp"></label>
      <select id="lamp-in"><option value="1" data-t="lamp1"></option><option value="2" data-t="lamp2"></option></select>
      <button id="btn-lamp" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblRgb"></label>
      <input id="rgb-in" type="color" value="#00aaff">
      <button id="btn-rgb" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblVoltage"></label>
      <select id="voltage-in">
        <option value="1" data-t="volt24"></option>
        <option value="2" data-t="volt36"></option>
        <option value="3" data-t="volt48"></option>
        <option value="4" data-t="volt60"></option>
      </select>
      <button id="btn-voltage" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblWheel"></label>
      <select id="wheel-in">
        <option value="1">5"</option>
        <option value="2">5.5"</option>
        <option value="3">6"</option>
        <option value="4">6.5"</option>
        <option value="5">8"</option>
        <option value="6">10"</option>
        <option value="7">12"</option>
        <option value="8">14"</option>
        <option value="9">16"</option>
        <option value="10">18"</option>
        <option value="11">20"</option>
      </select>
      <button id="btn-wheel" data-t="btnSet" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblSelfTest"></label>
      <button id="btn-selftest" data-t="btnRun" disabled></button>
    </div>
    <div class="set-row">
      <label data-t="lblInfo"></label>
      <button id="btn-info" data-t="btnQuery" disabled></button>
    </div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="expertTitle"></h2><button type="button" class="help-btn" data-help="expert" aria-label="Info">?</button></div>
    <div class="ctrl-block">
      <h3 data-t="eRegTitle"></h3>
      <div class="set-row three">
        <label data-t="eRegNr"></label>
        <input id="reg-nr" type="number" min="0" max="255" value="35">
        <input id="reg-val" type="number" min="0" max="65535" value="2">
      </div>
      <div class="btns"><button class="span2" id="btn-writereg" data-t="btnWriteReg" disabled></button></div>
    </div>
    <div class="ctrl-block">
      <h3 data-t="eReadTitle"></h3>
      <div class="set-row three">
        <label data-t="eRegNr"></label>
        <input id="read-addr" type="number" min="0" max="255" value="97">
        <input id="read-val" type="number" min="0" max="255" value="0">
      </div>
      <div class="btns"><button class="span2" id="btn-readreg" data-t="btnReadReg" disabled></button></div>
    </div>
    <div class="ctrl-block">
      <h3 data-t="eGovTitle"></h3>
      <p class="hint" data-t="eGovIntro"></p>
      <p class="warn" data-t="eGovWarn"></p>
      <div class="set-row three">
        <label data-t="eGovDrive"></label>
        <input id="gov-drive" type="number" min="0" max="127" value="100">
        <label data-t="eGovBrake"></label>
      </div>
      <div class="set-row three">
        <input id="gov-brake" type="number" min="0" max="127" value="100">
        <label data-t="eGovAccel"></label>
        <input id="gov-accel" type="number" min="0" max="127" value="100">
      </div>
      <div class="set-row three">
        <label data-t="eGovMax"></label>
        <input id="gov-max" type="number" min="0" max="127" value="100">
        <button id="btn-governor" data-t="btnSendGov" disabled></button>
      </div>
    </div>
    <div class="ctrl-block">
      <h3 data-t="eRawTitle"></h3>
      <input id="raw-hex" class="raw-in" type="text" data-t-ph="rawPh">
      <div class="btns">
        <button id="btn-raw" data-t="btnRaw" disabled></button>
        <button id="btn-raw-plain" data-t="btnRawPlain" disabled></button>
      </div>
    </div>
    <p class="hint" data-t="expertHint"></p>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/jo-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<script src="i18n.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
